get: 
  tags: 
    -  Order
  summary: "Get order by ID"
  description: "Get order by ID."
  operationId: getOrderById
  parameters: 
    - $ref: '../../components/paramaters/order_id.yaml'
  responses:
    '200':
      description: "successful operation"

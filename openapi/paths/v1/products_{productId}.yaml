get: 
  tags: 
    -  "Product"
  summary: "Get a product by ID."
  description: "Returns a single product."
  operationId: getProductById
  parameters: 
    - $ref: '../../components/paramaters/product_id.yaml'
  responses:
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/product.yaml'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '404':
      $ref: '../../components/responses/not_found_404.yaml'
put:
  tags: 
    - "Product"
  summary: "Update an existing product."
  description: "Updates an existing product."
  operationId: updateProductById
  parameters: 
    - $ref: '../../components/paramaters/product_id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/v1/product_update.yaml'
  responses:
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/product.yaml'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '404':
      $ref: '../../components/responses/not_found_404.yaml'
patch:
  tags: 
    - "Product"
  summary: "Patch an existing product."
  description: "Patches an existing product."
  operationId: patchProductById
  parameters: 
    - $ref: '../../components/paramaters/product_id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/v1/product_patch.yaml'
  responses:
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/product.yaml'
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '404':
      $ref: '../../components/responses/not_found_404.yaml'
delete:
  tags:
    - "Product"
  summary: "Delete a product."
  description: "Deletes a product."
  operationId: deleteProductById
  parameters: 
    - $ref: '../../components/paramaters/product_id.yaml'
  responses: 
    '204':
      description: "successful operation"
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'
    '404':
      $ref: '../../components/responses/not_found_404.yaml'
    '409':
      $ref: '../../components/responses/conflict_409.yaml'
get: 
  tags: 
    - Customer
  summary: "Get a customer by ID."
  description: "Returns a single customer."
  operationId: getCustomerById
  parameters:
    - $ref: '../../components/paramaters/customer_id.yaml'
  responses:
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/customer.yaml'
    '400':
      description: "Bad Request."
    '404':
      description: "Customer not found."
put:
  tags:
    - Customer
  summary: "Update an existing customer."
  description: "Updates an existing customer."
  operationId: updateCustomerById
  parameters: 
    - $ref: '../../components/paramaters/customer_id.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/v1/customer.yaml'
  responses: 
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/customer.yaml'
    '400':
      description: "Bad Request."
    '404':
      description: "Customer not found."
patch:
  tags:
    - Customer
  summary: "Patch an existing customer."
  description: "Patches an existing customer."
  operationId: patchCustomerById
  parameters: 
    - $ref: '../../components/paramaters/customer_id.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/v1/customer_patch.yaml'
  responses:
    '200':
      description: "successful operation"
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/customer.yaml'
    '400':
      description: "Bad Request."
    '404':
      description: "Customer not found."
delete:
  tags:
    - Customer
  summary: "Delete a customer by ID."
  description: "Deletes a single customer."
  operationId: deleteCustomerById
  parameters: 
    - $ref: '../../components/paramaters/customer_id.yaml'
  responses:
    '204':
      description: "No content."
    '400':
      description: "Bad Request."
    '404':
      $ref: '../../components/responses/Problem.yaml'
    '409':
      description: "Conflict."
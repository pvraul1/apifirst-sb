get:
  tags:
  - Customer
  summary: "Get a list of customers."
  description: "Returns a list of customers."
  operationId: listCustomers
  responses:
    '200':
      description: "Successful operation."
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/customer_list.yaml'
    '404':
      $ref: '../../components/responses/not_found_404.yaml'
post: 
  tags: 
    - Customer
  summary: "Create a new customer."
  description: "Creates a new customer."
  operationId: createCustomer
  requestBody: 
    content: 
      application/json: 
        schema: 
          $ref: '../../components/schemas/v1/customer.yaml'
  responses:
    '201':
      description: "Customer created."
      headers:
        Location:
          description: "The location of the new customer."
          schema:
            type: string
            format: uri
            example: "/v1/customers/123e4567-e89b-12d3-a456-426614174000"
    '400':
      description: "Bad Request."
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Problem.yaml'
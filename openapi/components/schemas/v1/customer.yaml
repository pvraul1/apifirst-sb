type: object
properties:
  id:
    $ref: '../common/uuid_id.yaml'
  name:
    $ref: 'name.yaml'
  shipToAddress:
    $ref: 'address.yaml'
  billToAddress:
    $ref: 'address.yaml'
  email:
    type: string
    description: "The email address of the customer."
    maxLength: 255
    minLength: 3
    example: "rperezv365@gmail.com"
    nullable: true
  phone:
    type: string
    description: "The phone number of the customer."
    maxLength: 15
    minLength: 7
    example: "123-456-7890"
    nullable: true
  paymentMethods:
    type: array
    nullable: true
    description: "The payment methods of the customer."
    items:
      $ref: payment_method.yaml
  dateCreated:
    $ref: '../common/iso_timestamp.yaml'
  dateUpdated:
    $ref: '../common/iso_timestamp.yaml'
required: 
  - name
  - shipToAddress
  - billToAddress
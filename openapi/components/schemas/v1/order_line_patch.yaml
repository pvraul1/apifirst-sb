type: object
nullable: true
properties:
  id: 
    type: string
    format: uuid
    description: "The unique identifier of the order line."
  productId:
    type: string
    format: uuid
    description: "The unique identifier of the product."
    nullable: true
  orderQuantity:
    type: integer
    description: "The quantity of the product in the order."
    minimum: 1
    maximum: 1000
    example: 2
    nullable: true
required:
  - id
type: object
properties:  
  id:
    $ref: '../common/uuid_id.yaml'
  url:
    type: string
    format: url
    description: "The URL of the image."
    minLength: 5
    maxLength: 500
    example: "https://www.example.com/image.jpg"
  altText:
    type: string
    description: "The alt text of the image."
    minLength: 3
    maxLength: 255
    nullable: true
  dateCreated:
    $ref: '../common/iso_timestamp.yaml'
  dateUpdated:
    $ref: '../common/iso_timestamp.yaml'
required:
  - url
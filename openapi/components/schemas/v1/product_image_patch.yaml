type: object
properties:  
  id:
    type: string
    format: uuid
    description: "The unique identifier of the image."
  url:
    type: string
    format: url
    description: "The URL of the image."
    minLength: 5
    maxLength: 500
    example: "https://www.example.com/image.jpg"
    nullable: true
  altText:
    type: string
    description: "The alt text of the image."
    minLength: 3
    maxLength: 255
    nullable: true
required:
  - id
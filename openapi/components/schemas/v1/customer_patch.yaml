type: object
properties:
  id:
    $ref: '../common/uuid_id.yaml'
  name:
    $ref: 'customer_name_patch.yaml'
  shipToAddress:
    $ref: 'customer_address_patch.yaml'
    nullable: true
  billToAddress:
    $ref: 'customer_address_patch.yaml'
    nullable: true
  email:
    type: string
    description: "The email address of the customer."
    maxLength: 255
    minLength: 3
    example: "rperezv365@gmail.com"
    nullable: true
  phone:
    type: string
    description: "The phone number of the customer."
    maxLength: 15
    minLength: 7
    example: "123-456-7890"
    nullable: true
  paymentMethods:
    type: array
    nullable: true
    description: "The payment methods of the customer."
    items:
      $ref: customer_payment_method_patch.yaml